[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nipat-desktop"
version = "0.8.0a1"
description = "Local desktop orchestration layer for the NIPAT scientific workflows"
readme = "README.md"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
]
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "ruff==0.17.2",
  "coverage==7.17.0",
]

[project.scripts]
nipat = "nipat.cli:main"

[tool.setuptools]
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "scientific/vendor/*/LICENSE"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nipat_scientific = ["catalog_data/*.json"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

# Baseline correctness checks; formatting and unused imports are not release gates.
[tool.ruff.lint]
select = ["E9", "F821", "F822", "F823"]

[tool.coverage.run]
branch = true
source = ["src/nipat", "src/nipat_scientific"]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 1

[tool.coverage.json]
output = "build/quality/coverage.json"

[tool.coverage.xml]
output = "build/quality/coverage.xml"
