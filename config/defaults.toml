# Runtime reference only; guided preferences are stored by Configura.
# The authoritative scientific defaults, ranges and readable model constants are
# in src/nipat_scientific/settings_data.json, shared by Python and R.
# Inspect with: nipat settings
# Export editable scientific configuration with: nipat settings --export PATH
# Apply with: nipat --scientific-config PATH --set cpin.min_child_reads=3 ...

[runtime]
compose_service = "scientific"

[scientific_registry]
path = "src/nipat_scientific/settings_data.json"
interface = "scientific-settings-v1"
