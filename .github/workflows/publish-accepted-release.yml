name: Publish accepted release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  select:
    if: >-
      github.repository == 'GregorioDalia/nipat-desktop' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      publish: ${{ steps.select.outputs.publish }}
    steps:
      - name: Checkout the accepted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Select acceptance changes
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          NIPAT_ACCEPTANCE_SELECT: '1'
        run: python .github/scripts/automatic_release.py

  release:
    needs: select
    if: needs.select.outputs.publish == 'true'
    concurrency:
      group: publish-nipat-release
      queue: max
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout the accepted main revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Test publication guards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Publish accepted installers or report no release change
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/automatic_release.py
