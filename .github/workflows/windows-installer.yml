name: Installers (review build)

on:
  # Installer candidates are explicit, expensive review builds. Ordinary pushes
  # and PRs run CI without generating or publishing new installers.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Each requested candidate has its own identity and is never cancelled by a push.
  group: installers-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  windows-checks:
    # Run the quick Windows checks before exporting the large Linux runtime assets.
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Record the exact checkout identity
        id: source
        run: python .github/scripts/ci_control.py source
      - name: Run shared Windows unit, installer and launcher checks
        shell: powershell
        run: ./.github/scripts/check_windows.ps1
      - name: Retain the tested shared launcher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-tested-launcher
          path: build/launcher/NIPAT.exe
          retention-days: 14
          if-no-files-found: error

  linux-runtime:
    needs: windows-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      NIPAT_RUNTIME_IMAGE: nipat-scientific-runtime:installer-test
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Record the exact checkout identity
        id: source
        run: python .github/scripts/ci_control.py source
      - name: Install pinned quality tools
        run: python -m pip install -r .github/quality-requirements.txt
      - name: Correctness-focused Python static checks
        run: python -m ruff check src engine scripts installer/linux .github/scripts
      - name: Python unit tests with branch coverage
        run: |
          mkdir -p build/quality
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage json
          python -m coverage report > build/quality/coverage.txt
      - name: CI selection, release and installer-set guard tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate local documentation links and anchors
        run: python .github/scripts/check_docs.py
      - name: Check dedicated daemon helper syntax
        run: bash -n installer/runtime/nipat-engine
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build scientific runtime using the dependency cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/scientific-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.NIPAT_RUNTIME_IMAGE }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-scientific-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-scientific-linux-amd64,mode=max,ignore-error=true
      - name: Verify bundled scientific scripts without host sources
        env:
          TMPDIR: ${{ runner.temp }}/nipat-engine-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_engine_package.py --image "$NIPAT_RUNTIME_IMAGE" 2>&1 | tee "$TMPDIR/verification.log"
      - name: Scientific regression and input-mode checks
        env:
          NIPAT_DATA_DIR: ${{ runner.temp }}/nipat-validation/data
          NIPAT_RUNS_DIR: ${{ runner.temp }}/nipat-validation/runs
        run: |
          mkdir -p "$NIPAT_DATA_DIR" "$NIPAT_RUNS_DIR"
          python -m nipat doctor --runtime
          python -m nipat self-test
      - name: Build dedicated WSL filesystem from pinned dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installer/runtime/Dockerfile
          platforms: linux/amd64
          tags: nipat-wsl-rootfs:installer-test
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-wsl-rootfs-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-wsl-rootfs-linux-amd64,mode=max,ignore-error=true
      - name: Check daemon startup in isolated Linux container
        # This exercises the helper on Linux; it is not a live Windows/WSL installation test.
        run: |
          docker run --rm --privileged --cgroupns=host \
            --mount type=volume,target=/var/lib/docker --mount type=volume,target=/var/lib/containerd \
            --entrypoint /bin/bash \
            nipat-wsl-rootfs:installer-test -euc \
            '/usr/local/bin/nipat-engine ensure; /usr/local/bin/nipat-engine ensure; docker info --format "{{.OSType}}"; docker compose version'
      - name: Fetch the exact previous published WSL component for verified reuse
        run: python .github/scripts/release_inputs.py --kind rootfs --output-dir build/previous-runtime
      - name: Export pinned assets and trusted installer manifest
        run: |
          python scripts/build_windows_installer_assets.py export \
            --output-dir build/assets --source-commit "$(git rev-parse HEAD)" \
            --scientific-image "$NIPAT_RUNTIME_IMAGE" --rootfs-image nipat-wsl-rootfs:installer-test \
            --reuse-rootfs-directory build/previous-runtime
          python scripts/build_windows_installer_assets.py stage \
            --manifest build/assets/installer-manifest.json --stage-dir build/windows-installer
      - name: Import the exact selected rootfs archive for qualification
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          import subprocess
          root = Path('build/assets')
          manifest = json.loads((root / 'installer-manifest.json').read_text())
          subprocess.run(['docker', 'image', 'import', str(root / manifest['assets']['rootfs']['file']),
                          'nipat-wsl-rootfs:exported-test'], check=True)
          PYCODE
      - name: Record resolved component inventories
        run: |
          python .github/scripts/component_inventory.py \
            --scientific-image "$NIPAT_RUNTIME_IMAGE" --rootfs-image nipat-wsl-rootfs:exported-test \
            --source-commit "$(git rev-parse HEAD)" --output build/assets/component-inventory.json
      - name: Load and execute exported image in the shipped engine
        shell: pwsh
        run: |
          ./installer/windows/test-runtime-image.ps1 `
            -ManifestPath build/assets/installer-manifest.json `
            -AssetDirectory build/assets `
            -RootfsImage nipat-wsl-rootfs:exported-test
      - name: Retain runtime assets for reviewed release or offline setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-runtime-assets
          path: build/assets/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain exact app and trusted manifest for Windows compilation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-installer-inputs
          path: build/windows-installer/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain regression logs and metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-scientific-check-logs
          path: |
            ${{ runner.temp }}/nipat-validation/runs/**/run.json
            ${{ runner.temp }}/nipat-validation/runs/**/execution.log
            ${{ runner.temp }}/nipat-engine-check/
            build/quality/
          retention-days: 14
          if-no-files-found: ignore

  windows-installer:
    needs: [linux-runtime, windows-checks]
    runs-on: windows-2022
    # The installer embeds the scientific archive and dedicated WSL filesystem.
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Download staged app and trusted manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-installer-inputs
          path: build/windows-installer
      - name: Download exact runtime archives for the self-contained installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-runtime-assets
          path: build/assets
      - name: Download the tested shared launcher into the installer stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-tested-launcher
          path: build/windows-installer/app
      - name: Compile the narrowly scoped WSL elevation helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source = (Resolve-Path 'installer/windows/EnableWsl.cs').Path
          $manifest = (Resolve-Path 'installer/windows/EnableWsl.manifest').Path
          $target = Join-Path (Resolve-Path 'build/windows-installer/app/installer/windows').Path 'EnableWsl.exe'
          & $compiler /nologo /target:exe /platform:x64 "/win32manifest:$manifest" "/out:$target" $source
          if ($LASTEXITCODE -ne 0) { throw 'WSL helper compilation failed.' }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw 'WSL helper was not written into the installer stage.' }
      - name: Record the application payload for safe reinstall and repair
        shell: powershell
        run: |
          python scripts/build_windows_installer_assets.py inventory --stage-dir build/windows-installer
          if ($LASTEXITCODE -ne 0) { throw 'Application payload inventory failed.' }
      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $compiler = & ./.github/scripts/install_inno.ps1 -Destination (Join-Path $env:RUNNER_TEMP 'InnoSetup')
          "NIPAT_ISCC=$compiler" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile the self-contained installer with verified embedded runtimes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = (Resolve-Path 'build/windows-installer').Path
          $assets = (Resolve-Path 'build/assets').Path
          $script = (Resolve-Path 'installer/windows/NIPAT.iss').Path
          $output = Join-Path $PWD 'build/output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          python scripts/build_windows_installer_assets.py verify-embedded `
            --manifest 'build/assets/installer-manifest.json' --stage-dir $stage --assets-dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime inputs do not match the trusted manifest.' }
          python scripts/build_windows_installer_assets.py verify-inventory --stage-dir $stage
          if ($LASTEXITCODE -ne 0) { throw 'Application payload does not match its inventory.' }
          & $env:NIPAT_ISCC "/DStageDir=$stage" "/DRuntimeAssetsDir=$assets" "/DOutputDir=$output" $script
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          python scripts/build_windows_installer_assets.py verify-embedded `
            --manifest 'build/assets/installer-manifest.json' --stage-dir $stage --assets-dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime inputs changed during compilation.' }
          python scripts/build_windows_installer_assets.py verify-inventory --stage-dir $stage
          if ($LASTEXITCODE -ne 0) { throw 'Application payload changed during compilation.' }
          if (@(Get-ChildItem -LiteralPath $output -Filter '*.bin' -File).Count -ne 0) {
            throw 'The installer must be a single EXE without companion data files.'
          }
          Copy-Item "$stage/app/.distribution/installer-manifest.json" $output
          # Retained as build evidence for the tested launcher embedded in the installer.
          Copy-Item "$stage/app/NIPAT.exe" $output
          $exe = Join-Path $output 'NIPAT-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -le 0 -or $size -ge 2GB) { throw 'The single-file installer must be smaller than 2 GiB.' }
          $manifestPath = Join-Path $output 'installer-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $embedded = [ordered]@{}
          foreach ($key in @('rootfs', 'scientific_image')) {
            $asset = $manifest.assets.$key
            $embedded[$key] = [ordered]@{ file = $asset.file; sha256 = $asset.sha256; size = $asset.size }
          }
          $record = [ordered]@{
            schema_version = 1; distribution = 'self-contained-wsl'
            version = $manifest.version; source_commit = $manifest.source_commit
            file = 'NIPAT-Setup.exe'; sha256 = $hash; size = $size
            installer_manifest_sha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            launcher_sha256 = (Get-FileHash -LiteralPath "$stage/app/NIPAT.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            embedded_assets = $embedded
            installation_profile = $manifest.installation_profile
          }
          [IO.File]::WriteAllText((Join-Path $output 'installer-build.json'), ($record | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding($false)))
          "$hash  NIPAT-Setup.exe" | Set-Content -LiteralPath "$output/SHA256SUMS" -Encoding ascii
      - name: Verify the final WSL package without publishing
        shell: powershell
        run: |
          @'
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("publisher", ".github/scripts/publish_windows_release.py")
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          manifest = json.loads(Path("build/assets/installer-manifest.json").read_text())
          publisher.prepare_assets(Path("build/output"), Path("build/assets"),
                                   Path("build/verified-release"), manifest["source_commit"])
          print("PASS: WSL installer identifies the verified source, installation profile, launcher and runtime archives.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Final distribution verification failed.' }
      - name: Exercise the packaged Windows client with its embedded Python
        # This checks the exact staged payload, not a live Windows 11 / WSL installation.
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & installer/windows/test-packaged-client.ps1 `
            -StageDirectory 'build/windows-installer' `
            -InstallerPath 'build/output/NIPAT-Setup.exe' `
            -OutputPath 'build/output/windows-client-check.json' `
            -WorkDirectory (Join-Path $env:RUNNER_TEMP ('NIPAT packaged client ' + [char]0x00e8))
          if ($LASTEXITCODE -ne 0) { throw 'Packaged Windows client verification failed.' }
          Copy-Item 'build/windows-installer/app/.distribution/application-files.json' 'build/output/application-files.json'
      - name: Retain installer for review (no release publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-windows-setup
          path: build/output/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain packaged Windows client diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-windows-client-logs
          path: |
            build/output/windows-client-check.json
            ${{ runner.temp }}/NIPAT packaged client è/logs/
            ${{ runner.temp }}/NIPAT packaged client è/runs/
          retention-days: 14
          if-no-files-found: ignore

  linux-installer:
    needs: linux-runtime
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Download the exact runtime archives used by Windows
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-runtime-assets
          path: build/assets
      - name: Build the self-contained Ubuntu package
        run: |
          python scripts/build_linux_installer.py \
            --manifest build/assets/installer-manifest.json \
            --output-dir build/linux-output
      - name: Install with missing dependencies in a clean Ubuntu container
        # No host Docker socket or writable mount is exposed to the container.
        # This verifies APT resolution, not a fresh Ubuntu Desktop installation.
        run: |
          package=(build/linux-output/*.deb)
          test "${#package[@]}" -eq 1
          python scripts/verify_linux_dependencies.py \
            --package "${package[0]}" \
            --manifest build/assets/installer-manifest.json \
            --output build/linux-output/linux-dependency-check.json
      - name: Install and exercise the package as a non-root user
        # The runner already has Docker access. This is not a clean Ubuntu Desktop test.
        run: |
          package=(build/linux-output/*.deb)
          test "${#package[@]}" -eq 1
          python scripts/verify_linux_installer.py \
            --package "${package[0]}" \
            --manifest build/assets/installer-manifest.json \
            --work-dir "$RUNNER_TEMP/NIPAT Linux installation check" \
            --output build/linux-output/linux-installation-check.json \
            --system-package-test
      - name: Fetch the exact published 0.7.1 upgrade baseline
        run: python .github/scripts/release_inputs.py --tag v0.7.1 --kind deb --output-dir build/upgrade-baseline
      - name: Upgrade the real previous package and preserve research data
        run: |
          package=(build/linux-output/*.deb)
          test "${#package[@]}" -eq 1
          set -o pipefail
          python scripts/verify_linux_upgrade.py \
            --previous-package build/upgrade-baseline/nipat-desktop_0.7.1_amd64.deb \
            --package "${package[0]}" --manifest build/assets/installer-manifest.json \
            --work-dir "$RUNNER_TEMP/NIPAT Linux upgrade check" \
            --output build/linux-output/linux-upgrade-check.json --system-package-test \
            2>&1 | tee build/linux-output/linux-upgrade.log
      - name: Retain the Ubuntu package and installation evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-linux-setup
          path: build/linux-output/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain Linux installation and scientific diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-linux-installation-logs
          path: |
            build/linux-output/linux-dependency-check.json
            build/linux-output/linux-installation-check.json
            build/linux-output/linux-upgrade-check.json
            build/linux-output/linux-upgrade.log
            ${{ runner.temp }}/NIPAT Linux installation check/user state with spaces/nipat-desktop/setup.log
            ${{ runner.temp }}/NIPAT Linux installation check/user state with spaces/nipat-desktop/state.json
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/run.json
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/execution.log
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/workflow-state.json
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/engine-plan.json
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/request.json
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/command.log
            ${{ runner.temp }}/NIPAT Linux installation check/user data with spaces/nipat-desktop/runs/**/preparation.log
          retention-days: 14
          if-no-files-found: ignore

  installer-required:
    if: always()
    needs: [windows-installer, linux-installer]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Require both installer checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          results = json.loads(os.environ["CHECK_RESULTS"])
          failed = {name: job["result"] for name, job in results.items() if job["result"] != "success"}
          if failed:
              raise SystemExit(f"Both installers must pass: {failed}")
          PY
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Record the exact checkout identity
        id: source
        run: python .github/scripts/ci_control.py source
      - name: Download the verified Windows installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-windows-setup
          path: build/windows-output
      - name: Download the verified Linux installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-linux-setup
          path: build/linux-output
      - name: Download the shared runtime identity
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-runtime-assets
          path: build/assets
      - name: Download synthetic scientific diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-scientific-check-logs
          path: build/evidence/scientific
      - name: Download staged Windows client diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-windows-client-logs
          path: build/evidence/windows
      - name: Download installed Linux diagnostics
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-linux-installation-logs
          path: build/evidence/linux
      - name: Verify both installers identify the same source and scientific archive
        run: |
          python .github/scripts/verify_installer_set.py \
            --windows-dir build/windows-output --linux-dir build/linux-output \
            --assets-dir build/assets --output-dir build/verified-installers \
            --source-commit "$(git rev-parse HEAD)"
      - name: Preserve bounded synthetic qualification evidence for accepted releases
        run: |
          python .github/scripts/qualification_evidence.py \
            --installer-set build/verified-installers/installer-set-check.json \
            --output-dir build/verified-installers \
            --source scientific build/evidence/scientific \
            --source windows-client build/evidence/windows \
            --source installed-linux build/evidence/linux \
            --source windows-package build/windows-output \
            --source linux-package build/linux-output \
            --source components build/assets \
            --source synthetic-fixtures tests/fixtures \
            --redact-root "$GITHUB_WORKSPACE" --redact-root "$RUNNER_TEMP"
      - name: Retain the installer-set verification without publishing
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-installer-set-evidence
          path: build/verified-installers/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Provide the verified Windows setup as one downloadable file
        id: windows-download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: build/windows-output/NIPAT-Setup.exe
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Provide the verified Ubuntu package as one downloadable file
        id: linux-download
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: build/linux-output/*.deb
          archive: false
          retention-days: 14
          if-no-files-found: error
      - name: Summarize the candidate installer downloads
        env:
          WINDOWS_SETUP_URL: ${{ steps.windows-download.outputs.artifact-url }}
          WINDOWS_SETUP_SHA256: ${{ steps.windows-download.outputs.artifact-digest }}
          LINUX_SETUP_URL: ${{ steps.linux-download.outputs.artifact-url }}
          LINUX_SETUP_SHA256: ${{ steps.linux-download.outputs.artifact-digest }}
        run: |
          python - <<'PY'
          import hashlib
          import os
          from pathlib import Path
          setup_hash = os.environ["WINDOWS_SETUP_SHA256"]
          # The unarchived upload must identify the same bytes as the reviewed setup.
          with Path("build/windows-output/NIPAT-Setup.exe").open("rb") as installer:
              expected = hashlib.file_digest(installer, "sha256").hexdigest()
          if setup_hash != expected:
              raise SystemExit("Direct Windows download differs from the verified installer")
          packages = list(Path("build/linux-output").glob("*.deb"))
          if len(packages) != 1:
              raise SystemExit("Expected exactly one verified Ubuntu package")
          linux_hash = os.environ["LINUX_SETUP_SHA256"]
          with packages[0].open("rb") as installer:
              expected = hashlib.file_digest(installer, "sha256").hexdigest()
          if linux_hash != expected:
              raise SystemExit("Direct Ubuntu download differs from the verified installer")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Candidate installer downloads\n\n")
              summary.write(f"[Download NIPAT-Setup.exe]({os.environ['WINDOWS_SETUP_URL']})\n\n")
              summary.write(f"Windows SHA-256: `{setup_hash}`\n\n")
              summary.write(f"[Download {packages[0].name}]({os.environ['LINUX_SETUP_URL']})\n\n")
              summary.write(f"Ubuntu SHA-256: `{linux_hash}`\n\n")
              summary.write("One self-contained installer per platform; no ZIP extraction or separate runtime downloads. ")
              summary.write("Sign in to GitHub to download. Available for 14 days.\n\n")
              summary.write("Internal unsigned candidate. This build is not a published or accepted release.\n")
          PY
