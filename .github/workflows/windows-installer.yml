name: Windows installer (review build)

on:
  # The stable CI gate runs on every PR. Large installer builds are reviewed
  # only for packaging/runtime changes, or requested explicitly for a release.
  pull_request:
    paths:
      - 'installer/**'
      - 'docker/**'
      - 'engine/**'
      - 'src/nipat_scientific/**'
      - 'scientific/**'
      - 'tests/test_engine_package.py'
      - 'tests/test_contamination_engine.py'
      - 'tests/test_bundled_runner.py'
      - 'tests/test_snp_engine.py'
      - 'tests/test_dnp_engine.py'
      - 'tests/test_dnp_workflow.py'
      - 'tests/test_cpi_engine.py'
      - 'tests/fixtures/**'
      - 'tests/test_input_modes.py'
      - 'scripts/windows/**'
      - 'scripts/build_*'
      - 'scripts/distribution_support.py'
      - 'tests/test_distribution.py'
      - 'tests/test_installer_assets.py'
      - 'scripts/verify_engine_package.py'
      - 'scripts/verify_dnp_engine.py'
      - 'scripts/verify_cpi_engine.py'
      - 'distribution-files.txt'
      - 'compose.yaml'
      - 'pyproject.toml'
      - 'src/nipat/__init__.py'
      - '.dockerignore'
      - '.github/workflows/windows-installer.yml'
      - '.github/scripts/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-checks:
    # Run the quick Windows checks before exporting the large Linux runtime assets.
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Windows Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem scripts/windows,installer/windows -Recurse -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Test bootstrap guards with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-bootstrap.ps1
      - name: Test scientific image identity with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-scientific-image.ps1
      - name: Test resumable WSL migration with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-migration.ps1
      - name: Compile the shared NIPAT executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./installer/windows/build-launcher.ps1 -OutputPath (Join-Path $PWD 'build/launcher/NIPAT.exe')
          if ($LASTEXITCODE -ne 0) { throw 'NIPAT launcher compilation failed.' }
      - name: Test the shared executable with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-launcher.ps1 -LauncherPath build/launcher/NIPAT.exe
      - name: Retain the tested shared launcher
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-tested-launcher
          path: build/launcher/NIPAT.exe
          retention-days: 14
          if-no-files-found: error

  linux-runtime:
    needs: windows-checks
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: src
      NIPAT_RUNTIME_IMAGE: nipat-scientific-runtime:installer-test
    steps:
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Release package guard tests
        run: python -m unittest discover -s .github/scripts -p 'test_publish_windows_release.py' -v
      - name: Check dedicated daemon helper syntax
        run: bash -n installer/runtime/nipat-engine
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build scientific runtime using the dependency cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/scientific-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.NIPAT_RUNTIME_IMAGE }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-scientific-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-scientific-linux-amd64,mode=max,ignore-error=true
      - name: Verify bundled scientific scripts without host sources
        run: python scripts/verify_engine_package.py --image "$NIPAT_RUNTIME_IMAGE"
      - name: Scientific regression and input-mode checks
        env:
          NIPAT_DATA_DIR: ${{ runner.temp }}/nipat-validation/data
          NIPAT_RUNS_DIR: ${{ runner.temp }}/nipat-validation/runs
        run: |
          mkdir -p "$NIPAT_DATA_DIR" "$NIPAT_RUNS_DIR"
          python -m nipat doctor --runtime
          python -m nipat self-test
      - name: Build dedicated WSL filesystem from pinned dependencies
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installer/runtime/Dockerfile
          platforms: linux/amd64
          tags: nipat-wsl-rootfs:installer-test
          build-args: SOURCE_COMMIT=${{ github.sha }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-wsl-rootfs-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-wsl-rootfs-linux-amd64,mode=max,ignore-error=true
      - name: Check daemon startup in isolated Linux container
        # This exercises the helper on Linux; it is not a live Windows/WSL installation test.
        run: |
          docker run --rm --privileged --cgroupns=host --entrypoint /bin/bash \
            nipat-wsl-rootfs:installer-test -euc \
            '/usr/local/bin/nipat-engine ensure; /usr/local/bin/nipat-engine ensure; docker info --format "{{.OSType}}"; docker compose version'
      - name: Export pinned assets and trusted installer manifest
        run: |
          python scripts/build_windows_installer_assets.py export \
            --output-dir build/assets --source-commit "$(git rev-parse HEAD)" \
            --scientific-image "$NIPAT_RUNTIME_IMAGE" --rootfs-image nipat-wsl-rootfs:installer-test
          python scripts/build_windows_installer_assets.py stage \
            --manifest build/assets/installer-manifest.json --stage-dir build/windows-installer
      - name: Load and execute exported image in the shipped engine
        shell: pwsh
        run: |
          ./installer/windows/test-runtime-image.ps1 `
            -ManifestPath build/assets/installer-manifest.json `
            -AssetDirectory build/assets `
            -RootfsImage nipat-wsl-rootfs:installer-test
      - name: Retain runtime assets for reviewed release or offline setup
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-runtime-assets
          path: build/assets/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain exact app and trusted manifest for Windows compilation
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-installer-inputs
          path: build/windows-installer/
          include-hidden-files: true
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
      - name: Retain regression logs and metadata
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-scientific-check-logs
          path: |
            ${{ runner.temp }}/nipat-validation/runs/**/run.json
            ${{ runner.temp }}/nipat-validation/runs/**/execution.log
          retention-days: 14
          if-no-files-found: ignore

  windows-installer:
    needs: [linux-runtime, windows-checks]
    runs-on: windows-2022
    # The installer embeds the scientific archive and dedicated WSL filesystem.
    timeout-minutes: 45
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Download staged app and trusted manifest
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-installer-inputs
          path: build/windows-installer
      - name: Download exact runtime archives for the self-contained installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-runtime-assets
          path: build/assets
      - name: Download the tested shared launcher into the installer stage
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: nipat-tested-launcher
          path: build/windows-installer/app
      - name: Compile the narrowly scoped WSL elevation helper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Join-Path $env:WINDIR 'Microsoft.NET/Framework64/v4.0.30319/csc.exe'
          $source = (Resolve-Path 'installer/windows/EnableWsl.cs').Path
          $manifest = (Resolve-Path 'installer/windows/EnableWsl.manifest').Path
          $target = Join-Path (Resolve-Path 'build/windows-installer/app/installer/windows').Path 'EnableWsl.exe'
          & $compiler /nologo /target:exe /platform:x64 "/win32manifest:$manifest" "/out:$target" $source
          if ($LASTEXITCODE -ne 0) { throw 'WSL helper compilation failed.' }
          if (-not (Test-Path -LiteralPath $target -PathType Leaf)) { throw 'WSL helper was not written into the installer stage.' }
      - name: Install verified Inno Setup compiler
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $download = Join-Path $env:RUNNER_TEMP 'innosetup-6.7.3.exe'
          Invoke-WebRequest -UseBasicParsing 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $download
          $signature = Get-AuthenticodeSignature -LiteralPath $download
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch '(?:^|,\s*)CN=Pyrsys B\.V\.(?:,|$)') {
            throw 'Inno Setup Authenticode signature or publisher is invalid.'
          }
          $inno = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process -FilePath $download -Wait -PassThru -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-',"/DIR=`"$inno`"")
          if ($process.ExitCode -ne 0) { throw "Inno Setup installation failed: $($process.ExitCode)" }
          "NIPAT_ISCC=$inno\ISCC.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Compile the self-contained installer with verified embedded runtimes
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = (Resolve-Path 'build/windows-installer').Path
          $assets = (Resolve-Path 'build/assets').Path
          $script = (Resolve-Path 'installer/windows/NIPAT.iss').Path
          $output = Join-Path $PWD 'build/output'
          New-Item -ItemType Directory -Path $output -Force | Out-Null
          python scripts/build_windows_installer_assets.py verify-embedded `
            --manifest 'build/assets/installer-manifest.json' --stage-dir $stage --assets-dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime inputs do not match the trusted manifest.' }
          & $env:NIPAT_ISCC "/DStageDir=$stage" "/DRuntimeAssetsDir=$assets" "/DOutputDir=$output" $script
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup compilation failed.' }
          python scripts/build_windows_installer_assets.py verify-embedded `
            --manifest 'build/assets/installer-manifest.json' --stage-dir $stage --assets-dir $assets
          if ($LASTEXITCODE -ne 0) { throw 'Embedded runtime inputs changed during compilation.' }
          if (@(Get-ChildItem -LiteralPath $output -Filter '*.bin' -File).Count -ne 0) {
            throw 'The installer must be a single EXE without companion data files.'
          }
          Copy-Item "$stage/app/.distribution/installer-manifest.json" $output
          # Retained as build evidence for the tested launcher embedded in the installer.
          Copy-Item "$stage/app/NIPAT.exe" $output
          $exe = Join-Path $output 'NIPAT-Setup.exe'
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $size = (Get-Item -LiteralPath $exe).Length
          if ($size -le 0 -or $size -ge 2GB) { throw 'The single-file installer must be smaller than 2 GiB.' }
          $manifestPath = Join-Path $output 'installer-manifest.json'
          $manifest = Get-Content -LiteralPath $manifestPath -Raw -Encoding UTF8 | ConvertFrom-Json
          $embedded = [ordered]@{}
          foreach ($key in @('rootfs', 'scientific_image')) {
            $asset = $manifest.assets.$key
            $embedded[$key] = [ordered]@{ file = $asset.file; sha256 = $asset.sha256; size = $asset.size }
          }
          $record = [ordered]@{
            schema_version = 1; distribution = 'self-contained-wsl'
            version = $manifest.version; source_commit = $manifest.source_commit
            file = 'NIPAT-Setup.exe'; sha256 = $hash; size = $size
            installer_manifest_sha256 = (Get-FileHash -LiteralPath $manifestPath -Algorithm SHA256).Hash.ToLowerInvariant()
            launcher_sha256 = (Get-FileHash -LiteralPath "$stage/app/NIPAT.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
            embedded_assets = $embedded
            installation_profile = $manifest.installation_profile
          }
          [IO.File]::WriteAllText((Join-Path $output 'installer-build.json'), ($record | ConvertTo-Json -Depth 6), (New-Object Text.UTF8Encoding($false)))
          "$hash  NIPAT-Setup.exe" | Set-Content -LiteralPath "$output/SHA256SUMS" -Encoding ascii
      - name: Verify the final WSL package without publishing
        shell: powershell
        run: |
          @'
          import importlib.util
          import json
          from pathlib import Path
          spec = importlib.util.spec_from_file_location("publisher", ".github/scripts/publish_windows_release.py")
          publisher = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(publisher)
          manifest = json.loads(Path("build/assets/installer-manifest.json").read_text())
          publisher.prepare_assets(Path("build/output"), Path("build/assets"),
                                   Path("build/verified-release"), manifest["source_commit"])
          print("PASS: WSL installer identifies the verified source, installation profile, launcher and runtime archives.")
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Final distribution verification failed.' }
      - name: Retain installer for review (no release publication)
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-windows-setup
          path: build/output/
          compression-level: 0
          retention-days: 14
          if-no-files-found: error
