name: Publish verified Windows pre-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Windows installer build run ID
        required: true
        type: string
      source_commit:
        description: Exact 40-character commit SHA of that build
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-windows-prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'GregorioDalia/nipat-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout publication procedure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Test release guards
        run: python -m unittest discover -s .github/scripts -p 'test_publish_windows_release.py' -v
      - name: Verify existing build assets and publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          BUILD_SOURCE_COMMIT: ${{ inputs.source_commit }}
        run: |
          python .github/scripts/publish_windows_release.py \
            --run-id "$BUILD_RUN_ID" --source-commit "$BUILD_SOURCE_COMMIT"
