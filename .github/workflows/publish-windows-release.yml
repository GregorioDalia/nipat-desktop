name: Publish verified pre-release

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful installer build run ID (Windows and Ubuntu for 0.5)
        required: true
        type: string
      source_commit:
        description: Exact 40-character commit SHA of that build
        required: true
        type: string
      draft_release_id:
        description: Existing draft release ID to resume (optional)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-nipat-prerelease
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'GregorioDalia/nipat-desktop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    steps:
      - name: Checkout publication procedure
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Test release guards
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Verify joint build and committed desktop acceptance, then publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.run_id }}
          BUILD_SOURCE_COMMIT: ${{ inputs.source_commit }}
          DRAFT_RELEASE_ID: ${{ inputs.draft_release_id }}
        run: |
          python .github/scripts/publish_windows_release.py \
            --run-id "$BUILD_RUN_ID" --source-commit "$BUILD_SOURCE_COMMIT" \
            --draft-release-id "$DRAFT_RELEASE_ID"
