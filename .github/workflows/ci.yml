name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run_checks: ${{ steps.ownership.outputs.run_checks }}
      duplicate_pr: ${{ steps.ownership.outputs.duplicate_pr }}
      ownership_reason: ${{ steps.ownership.outputs.ownership_reason }}
      client: ${{ steps.select.outputs.client }}
      scientific: ${{ steps.select.outputs.scientific }}
      runtime: ${{ steps.select.outputs.runtime }}
      packaging: ${{ steps.select.outputs.packaging }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Record the exact checkout identity
        id: source
        run: python .github/scripts/ci_control.py source
      - name: Avoid duplicate branch-push and PR checks
        id: ownership
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/ci_control.py ownership
      - name: Select scientific integration checks
        id: select
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ steps.source.outputs.source_commit }}
          CI_EVENT: ${{ github.event_name }}
        run: python .github/scripts/ci_changes.py --base "$CI_BASE" --head "$CI_HEAD" --event "$CI_EVENT" --output "$GITHUB_OUTPUT"

  linux-checks:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Install pinned quality tools
        run: python -m pip install -r .github/quality-requirements.txt
      - name: Correctness-focused Python static checks
        run: python -m ruff check src engine scripts installer/linux .github/scripts
      - name: Python unit tests with branch coverage
        run: |
          mkdir -p build/quality
          python -m coverage run -m unittest discover -s tests -v
      - name: Record branch coverage without an arbitrary percentage gate
        if: always()
        run: |
          python -m coverage json
          python -m coverage xml
          python -m coverage report > build/quality/coverage.txt
      - name: Retain quality baseline and missing branches
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nipat-python-quality
          path: build/quality/
          retention-days: 14
          if-no-files-found: error
      - name: CI selection and release guard tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Validate local documentation links and anchors
        run: python .github/scripts/check_docs.py
      - name: Check dedicated daemon helper syntax
        run: bash -n installer/runtime/nipat-engine

  windows-checks:
    needs: changes
    if: needs.changes.outputs.run_checks == 'true'
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Run shared Windows unit, installer and launcher checks
        shell: powershell
        run: ./.github/scripts/check_windows.ps1

  scientific:
    needs: [changes, linux-checks, windows-checks]
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.scientific == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      NIPAT_RUNTIME_IMAGE: nipat-scientific-runtime:ci-test
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build scientific runtime using the dependency cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/scientific-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.NIPAT_RUNTIME_IMAGE }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-scientific-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-scientific-linux-amd64,mode=max,ignore-error=true
      - name: Verify bundled scientific scripts without host sources
        env:
          TMPDIR: ${{ runner.temp }}/nipat-engine-check
        run: |
          mkdir -p "$TMPDIR"
          set -o pipefail
          python scripts/verify_engine_package.py --image "$NIPAT_RUNTIME_IMAGE" 2>&1 | tee "$TMPDIR/verification.log"
      - name: Scientific regression and input-mode checks
        env:
          NIPAT_DATA_DIR: ${{ runner.temp }}/nipat-validation/data
          NIPAT_RUNS_DIR: ${{ runner.temp }}/nipat-validation/runs
        run: |
          mkdir -p "$NIPAT_DATA_DIR" "$NIPAT_RUNS_DIR"
          python -m nipat doctor --runtime
          python -m nipat self-test
      - name: Retain scientific diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nipat-ci-scientific-logs
          path: |
            ${{ runner.temp }}/nipat-validation/runs/**/run.json
            ${{ runner.temp }}/nipat-validation/runs/**/execution.log
            ${{ runner.temp }}/nipat-engine-check/
          retention-days: 14
          if-no-files-found: ignore

  runtime:
    needs: [changes, linux-checks, windows-checks]
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.runtime == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout runtime source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the changed dedicated runtime
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: installer/runtime/Dockerfile
          platforms: linux/amd64
          tags: nipat-wsl-rootfs:ci-test
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-wsl-rootfs-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-wsl-rootfs-linux-amd64,mode=max,ignore-error=true
      - name: Exercise daemon startup and exact component provenance
        # Isolated Linux runtime integration; this does not claim Windows/WSL acceptance.
        run: |
          docker run --rm --privileged --cgroupns=host \
            --mount type=volume,target=/var/lib/docker --mount type=volume,target=/var/lib/containerd \
            --entrypoint /bin/bash \
            nipat-wsl-rootfs:ci-test -euc \
            '/usr/local/bin/nipat-engine ensure; /usr/local/bin/nipat-engine ensure; docker info --format "{{.OSType}}"; docker compose version; test -s /etc/nipat-runtime.json'

  packaging:
    needs: [changes, linux-checks, windows-checks]
    if: needs.changes.outputs.run_checks == 'true' && needs.changes.outputs.packaging == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout package contracts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12.10'
      - name: Exercise package contents, manifest and actual DEB fixture construction
        run: |
          python -m unittest discover -s tests -p 'test_*installer*.py' -v
          python -m unittest discover -s tests -p 'test_distribution.py' -v
          python -m unittest discover -s .github/scripts -p 'test_verify_installer_set.py' -v

  required:
    # Branch protection requires this stable job name, including documentation-only PRs.
    # A delegated branch push cannot satisfy the protected PR/main context.
    name: ${{ github.event_name == 'push' && github.ref != 'refs/heads/main' && 'branch-required' || 'required' }}
    if: always()
    needs: [changes, linux-checks, windows-checks, scientific, runtime, packaging]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout gate implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require all applicable checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: python .github/scripts/ci_control.py gate
