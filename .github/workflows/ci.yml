name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scientific: ${{ steps.select.outputs.scientific }}
      reason: ${{ steps.select.outputs.reason }}
    steps:
      - name: Checkout comparison history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Select scientific integration checks
        id: select
        env:
          CI_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
          CI_HEAD: ${{ github.sha }}
          CI_EVENT: ${{ github.event_name }}
        run: python .github/scripts/ci_changes.py --base "$CI_BASE" --head "$CI_HEAD" --event "$CI_EVENT" --output "$GITHUB_OUTPUT"

  linux-checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONPATH: src
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Python unit tests
        run: python -m unittest discover -s tests -v
      - name: CI selection and release guard tests
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Check dedicated daemon helper syntax
        run: bash -n installer/runtime/nipat-engine

  windows-checks:
    runs-on: windows-2022
    timeout-minutes: 15
    env:
      PYTHONPATH: src
    steps:
      - name: Preserve source bytes for manifest verification
        shell: powershell
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - name: Checkout exact source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Windows Python unit tests
        run: python -m unittest discover -s tests -v
      - name: Parse scripts with Windows PowerShell 5.1
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $files = Get-ChildItem scripts/windows,installer/windows -Recurse -Filter '*.ps1' -File
          foreach ($file in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($file.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw ($errors | Out-String) }
          }
      - name: Test bootstrap guards with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-bootstrap.ps1
      - name: Test scientific image identity with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-scientific-image.ps1
      - name: Test resumable WSL migration with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-migration.ps1
      - name: Test Authenticode verification policy with mocked trust results
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-signatures.ps1
      - name: Compile the shared NIPAT executable
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & ./installer/windows/build-launcher.ps1 -OutputPath (Join-Path $PWD 'build/launcher/NIPAT.exe')
          if ($LASTEXITCODE -ne 0) { throw 'NIPAT launcher compilation failed.' }
      - name: Test the shared executable with Windows PowerShell 5.1
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File installer/windows/test-launcher.ps1 -LauncherPath build/launcher/NIPAT.exe

  scientific:
    needs: [changes, linux-checks, windows-checks]
    if: needs.changes.outputs.scientific == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PYTHONPATH: src
      NIPAT_RUNTIME_IMAGE: nipat-scientific-runtime:ci-test
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12.10'
      - name: Set up Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Build scientific runtime using the dependency cache
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/scientific-runtime/Dockerfile
          platforms: linux/amd64
          tags: ${{ env.NIPAT_RUNTIME_IMAGE }}
          load: true
          pull: true
          provenance: false
          cache-from: type=gha,version=2,scope=nipat-scientific-linux-amd64
          cache-to: type=gha,version=2,scope=nipat-scientific-linux-amd64,mode=max,ignore-error=true
      - name: Verify bundled scientific scripts without host sources
        run: python scripts/verify_engine_package.py --image "$NIPAT_RUNTIME_IMAGE"
      - name: Scientific regression and input-mode checks
        env:
          NIPAT_DATA_DIR: ${{ runner.temp }}/nipat-validation/data
          NIPAT_RUNS_DIR: ${{ runner.temp }}/nipat-validation/runs
        run: |
          mkdir -p "$NIPAT_DATA_DIR" "$NIPAT_RUNS_DIR"
          python -m nipat doctor --runtime
          python -m nipat self-test
      - name: Retain scientific diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: nipat-ci-scientific-logs
          path: |
            ${{ runner.temp }}/nipat-validation/runs/**/run.json
            ${{ runner.temp }}/nipat-validation/runs/**/execution.log
          retention-days: 14
          if-no-files-found: ignore

  required:
    # Branch protection requires this stable job name, including documentation-only PRs.
    name: required
    if: always()
    needs: [changes, linux-checks, windows-checks, scientific]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require all applicable checks
        env:
          CHECK_RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          results = json.loads(os.environ["CHECK_RESULTS"])
          errors = []
          for name in ("changes", "linux-checks", "windows-checks"):
              if results[name]["result"] != "success":
                  errors.append(f"{name}: {results[name]['result']}")
          selected = results["changes"].get("outputs", {}).get("scientific")
          expected = {"true": "success", "false": "skipped"}.get(selected)
          actual = results["scientific"]["result"]
          if expected is None or actual != expected:
              errors.append(f"scientific: {actual}; required selection: {selected}")
          if errors:
              print("CI failed: " + "; ".join(errors))
              sys.exit(1)
          print("All applicable checks passed. " + results["changes"]["outputs"]["reason"])
          PY
