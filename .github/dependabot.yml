version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ['*']
  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    groups:
      quality-tools:
        patterns: ['ruff', 'coverage']
