name: nipat

services:
  scientific:
    image: ${NIPAT_RUNTIME_IMAGE:-nipat-scientific-runtime:0.7.0a1}
    build:
      context: .
      dockerfile: docker/scientific-runtime/Dockerfile
    user: ${NIPAT_UID:-0}:${NIPAT_GID:-0}
    working_dir: /opt/nipat
    read_only: true
    network_mode: none
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    environment:
      TZ: Europe/Rome
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      HOME: /tmp
      TMPDIR: /tmp
